name: Issue Form
description: Report a bug, request a feature, or share feedback
title: "[Issue]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Please select the **Type** first.  
        **Problem** is required for all issues.  
        If **Bug**, use **Bug Details** to include Repro steps, Expected behavior, and Acceptance criteria.  
        If **Feature Request**, use **Solution & Benefits**.

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: Select the issue type.
      options:
        - Bug
        - Feature
        - Feedback
        - Other
      default: 0
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem or observation in simple terms. Be specific if it's a bug.
      placeholder: "What did you encounter? Where? Environment?"
    validations:
      required: true

  - type: textarea
    id: bug_details
    attributes:
      label: Bug Details (Only if **Bug**)
      description: Include **Steps to Reproduce**, **Expected Behavior**, and **Acceptance Criteria** in one place.
      placeholder: |
        ### Steps to Reproduce
        1.
        2.
        3.

        ### Expected Behavior
        - …

        ### Acceptance Criteria
        - [ ] …
        - [ ] …
    validations:
      required: false

  - type: textarea
    id: solution_benefits
    attributes:
      label: Solution & Benefits (Only if **Feature Request**)
      description: Describe the **Proposed Solution** and the **Expected Benefits** (impact, outcomes, metrics).
      placeholder: |
        ### Proposed Solution
        - …

        ### Expected Benefits
        - …
    validations:
      required: false

  # -------- SHARED / OPTIONAL --------
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context (Optional)
      description: Logs, screenshots, error messages, links, etc.
      placeholder: "Anything else we should know."
    validations:
      required: false

  - type: input
    id: related_task_id
    attributes:
      label: Related Task ID (Optional)
      description: e.g., MEED-00000
      placeholder: "MEED-00000"
    validations:
      required: false


