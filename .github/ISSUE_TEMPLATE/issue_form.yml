name: Issue Form
description: Report a bug, request a feature, or plan a task
title: "[Issue]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        **Instructions**
        1) Select the **Type**.
        2) Fill **Problem Statement** (required).
        3) Complete ONLY the section that matches your type:
           - **Bug** → *Steps to Reproduce & Expected Result*
           - **Feature** → *Solution & Expected Benefits*
           - **Task** → (Problem Statement is usually enough; add details in *Additional Context* if needed)

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: |
        **Definitions**
        - **Bug** — Something isn’t working as expected.
        - **Feature** — A new capability or an enhancement to existing behavior.
        - **Task** — A scoped piece of work that doesn’t change product behavior (e.g., refactor, docs, CI).
      options:
        - Bug
        - Feature
        - Task
      default: 0
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Works for all types. Be concrete and concise.
      placeholder: |
        For **Bug**: What happened? Where? Who is impacted? Environment?
        For **Feature**: What user need or goal are we addressing?
        For **Task**: What is the objective, scope, and success signal?
    validations:
      required: true

  # ---------- BUG ----------
  - type: textarea
    id: bug_repro_expected
    attributes:
      label: Bug — Steps to Reproduce & Expected Result
      description: Fill this only if Type = **Bug**.
      placeholder: |
        ### Steps to Reproduce
        1.
        2.
        3.

        ### Expected Result
        -
    validations:
      required: false

  # ---------- FEATURE ----------
  - type: textarea
    id: feature_solution_benefits
    attributes:
      label: Feature — Solution & Expected Benefits
      description: Fill this only if Type = **Feature**.
      placeholder: |
        ### Proposed Solution
        -

        ### Expected Benefits
        - Improves...
        - Reduces...
        - Measurable outcome: ...
    validations:
      required: false

  # ---------- SHARED ----------
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context (Optional)
      description: Logs, screenshots, error messages, links, environment, etc.
      placeholder: |
        Include any extra information that helps us reproduce or scope the work.
        Related Task ID (if any): e.g., MEED-00000
    validations:
      required: false
