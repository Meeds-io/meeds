name: Issue Form
description: Report a bug, request a feature, or share feedback
title: "[Issue]: "
labels: []
assignees: []
body:

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: |
        **Definitions**
        - **Bug** — Something isn’t working as expected.
        - **Feature** — New capability or an enhancement to existing behavior.
        - **Feedback** — Observation, idea, or UX concern.
        - **Other** — None of the above.
      options:
        - Bug
        - Feature
        - Feedback
        - Other
      default: 0
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened or what do you need? Be specific if it's a bug.
      placeholder: "What? Where? Who is impacted? Environment?"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details (fill depending on Type)
      description: Complete only the relevant section below.
      placeholder: |
        ## Bug
        ### Steps to Reproduce
        1.
        2.
        3.
        ### Expected Behavior
        -
        ### Acceptance Criteria
        - [ ] ...
        - [ ] ...

        ## Feature
        ### Proposed Solution
        -
        ### Expected Benefits
        -

        ## Feedback
        ### Notes
        -
    validations:
      required: false
