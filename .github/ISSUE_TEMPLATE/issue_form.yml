name: Issue Form
description: Report a bug, request a feature, or plan a task
labels: []
assignees: []
body:

  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Bug
        - Feature
        - Task
      default: 0
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Definitions**
        - **Bug** — Something isn’t working as expected.
        - **Feature** — A new capability or an enhancement to existing behavior.
        - **Task** — A scoped piece of work that doesn’t change product behavior (e.g., refactor, docs, CI).

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Works for all types. Be concrete and concise.
      value: |
        <!-- For Bug: What happened? Where? Who is impacted? Environment (browser, OS, device)? -->
        <!-- For Feature: What user need or goal are we addressing? Why now? -->
        <!-- For Task: What is the objective, scope, and success signal? -->
    validations:
      required: true

  # ---------- BUG ----------
  - type: textarea
    id: bug_repro_expected
    attributes:
      label: Bug — Steps to Reproduce & Expected Result (only if Type = Bug)
      value: |
        ### Steps to Reproduce
        1.
        2.
        3.

        ### Expected Result
        -

        <!-- Optional: Acceptance Criteria (for complex bugs)
        - [ ] ...
        - [ ] ...
        -->
    validations:
      required: false

  # ---------- FEATURE ----------
  - type: textarea
    id: feature_solution_benefits
    attributes:
      label: Feature — Solution & Expected Benefits (only if Type = Feature)
      value: |
        ### Proposed Solution
        -

        ### Expected Benefits
        <!--
        - Improves ...
        - Reduces ...
        - Measurable outcome: ...
        -->
    validations:
      required: false

  # ---------- SHARED ----------
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context (optional)
      value: |
        <!-- Logs, screenshots, error messages, links, environment, etc. -->
        <!-- Related Task ID (if any): e.g., MEED-00000 -->
    validations:
      required: false
