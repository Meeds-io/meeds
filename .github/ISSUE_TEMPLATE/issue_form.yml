name: Issue Form
description: Report a bug, request a feature, or share feedback
title: "[Issue]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Please select the **Type** first. Fill sections marked “Only if Bug” or “Only if Feature Request” accordingly.

  - type: dropdown
    id: type
    attributes:
      label: "Type"
      description: "Select the issue type."
      options:
        - Bug
        - Feature
        - Feedback
        - Other
      default: 0
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: "📝 Overview"
      description: "Short description in 1–2 sentences."
      placeholder: "Example: Unable to save changes on my profile page."
    validations:
      required: true

  - type: textarea
    id: problem_context
    attributes:
      label: "🔍 Problem / Context"
      description: "Describe the problem or observation. (General; if **Bug**, be specific.)"
      placeholder: "What did you encounter? Where? Environment?"
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: "🐞 Steps to Reproduce (Only if **Bug**)"
      description: "If reporting a bug, list the steps to reproduce."
      placeholder: |
        1. Go to [...]
        2. Click [...]
        3. Observe [...]
    validations:
      required: false

  - type: textarea
    id: expected_behavior
    attributes:
      label: "🎯 Expected Behavior (Only if **Bug**)"
      description: "What did you expect to happen?"
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "✅ Acceptance Criteria (Only if **Bug**)"
      description: "Checkable criteria to confirm the fix."
      placeholder: |
        - [ ] Action completes within 2 seconds
        - [ ] Confirmation message is displayed
    validations:
      required: false

  - type: textarea
    id: proposed_solution
    attributes:
      label: "💡 Proposed Solution (Only if **Feature**)"
      description: "Describe the new or improved functionality."
      placeholder: "Example: Add a confirmation dialog before saving."
    validations:
      required: false

  - type: textarea
    id: expected_benefits
    attributes:
      label: "🎉 Expected Benefits (Only if **Feature**)"
      description: "Why is this valuable? Impact, outcomes, metrics."
      placeholder: "Example: Streamlines saving and reduces user errors."
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: "🔗 Additional Context (Optional)"
      description: "Logs, screenshots, error messages, links, etc."
      placeholder: "Anything else we should know."
    validations:
      required: false

  - type: input
    id: related_task_id
    attributes:
      label: "Related Task ID (Optional)"
      description: "e.g., MEED-00000"
      placeholder: "MEED-00000"
    validations:
      required: false

