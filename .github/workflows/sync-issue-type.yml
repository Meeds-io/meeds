name: Sync issue type & tidy body
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  sync:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Detect type, set GitHub type, drop empty sections, then tidy headings
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            let body = issue.body || "";

            // ---------- 1) Extract selected Type from the "### Type" section ----------
            // Capture the Type block (from "### Type" until next heading or EOF)
            const typeBlockMatch = body.match(/(^|\n)#{2,}\s*Type\s*\n+([\s\S]*?)(?=\n#{2,}\s|\n*$)/i);
            let selected = null;
            if (typeBlockMatch) {
              const typeBlock = typeBlockMatch[2];
              const typeValueMatch = typeBlock.match(/\b(Bug|Feature|Task)\b/i);
              if (typeValueMatch) selected = typeValueMatch[1].toLowerCase(); // "bug" | "feature" | "task"
            }

            // ---------- 2) Map to official GitHub issue type ----------
            let typeMapped = false;
            if (selected) {
              const map = { bug: "bug", feature: "feature", task: "task" };
              const ghType = map[selected];
              if (ghType) {
                try {
                  await github.request("PATCH /repos/{owner}/{repo}/issues/{issue_number}", {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    type: ghType,
                  });
                  typeMapped = true;
                  core.info(`Set GitHub issue type to: ${ghType}`);
                } catch (e) {
                  core.warning(`Failed to set GitHub issue type: ${e.message}`);
                }
              }
            } else {
              core.info("No Type detected; skipping type mapping.");
            }

            let newBody = body;

            // ---------- Helpers (prefix-based, robust to dashes/spaces) ----------
            // Find a section by heading prefix; return {start, end, heading, content}
            function findSectionByPrefix(prefix) {
              const re = new RegExp(
                String.raw`(^|\n)(#{2,}\s*${prefix}\b[^\n]*\n)` + // heading line starts with "## <prefix>"
                String.raw`([\s\S]*?)(?=\n#{2,}\s|\n*$)`,            // content until next heading/EOF
                "i"
              );
              const m = newBody.match(re);
              if (!m) return null;
              const full = m[0];
              const start = m.index;
              const heading = m[2];   // the actual heading line matched
              const content = m[3];   // section content (no heading)
              const end = start + full.length;
              return { re, start, end, heading, content };
            }

            // Remove entire section if content is exactly "_No response_"
            function removeIfNoResponseByPrefix(prefix) {
              const sec = findSectionByPrefix(prefix);
              if (!sec) return false;
              if (/^\s*_No response_\s*$/i.test(sec.content.trim())) {
                newBody = newBody.slice(0, sec.start) + "\n" + newBody.slice(sec.end);
                core.info(`Removed empty section: ${prefix}`);
                return true;
              }
              return false;
            }

            // Rename the section heading to a clean simple H3 (keeps content)
            function renameHeadingSimpleByPrefix(prefix, toHeading) {
              const sec = findSectionByPrefix(prefix);
              if (!sec) return false;
              const before = newBody.slice(0, sec.start);
              const after = newBody.slice(sec.end);
              const newSection =
                (newBody[sec.start - 1] === "\n" ? "\n" : "") +
                `### ${toHeading}\n` +
                sec.content;
              newBody = before + newSection + after;
              core.info(`Renamed heading '${prefix}...' to: ${toHeading}`);
              return true;
            }

            // ---------- 3) FIRST: remove empty sections ----------
            const bugRemoved = removeIfNoResponseByPrefix("Bug");
            const featureRemoved = removeIfNoResponseByPrefix("Feature");
            // Optionnel : supprimer "Additional Context" vide aussi
            // const ctxRemoved = removeIfNoResponseByPrefix("Additional Context");

            // ---------- 4) THEN: tidy headings ----------
            // a) Normalize "Additional Context" (strip "(optional)" etc.)
            renameHeadingSimpleByPrefix("Additional Context", "Additional Context");

            // b) Replace any verbose per-type headings with a clean simple one
            if (selected === "bug" && !bugRemoved) {
              renameHeadingSimpleByPrefix("Bug", "Bug");
            }
            if (selected === "feature" && !featureRemoved) {
              renameHeadingSimpleByPrefix("Feature", "Feature");
            }

            // ---------- 5) FINALLY: remove the "Type" section if mapping succeeded ----------
            if (typeMapped && selected) {
              const typeSec = findSectionByPrefix("Type");
              if (typeSec) {
                newBody = newBody.slice(0, typeSec.start) + "\n" + newBody.slice(typeSec.end);
                core.info("Removed 'Type' section after successful mapping.");
              }
            } else {
              core.info("Keeping 'Type' section (type not mapped or not detected).");
            }

            // Normalize: collapse >2 blank lines into 1 for cleanliness
            newBody = newBody.replace(/\n{3,}/g, "\n\n");

            // ---------- 6) Patch body if changed ----------
            if (newBody !== body) {
              await github.request("PATCH /repos/{owner}/{repo}/issues/{issue_number}", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: newBody.trim() + "\n",
              });
              core.info("Issue body updated.");
            } else {
              core.info("No body changes needed.");
            }
