name: Sync issue type & tidy body
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  sync:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Detect type, set GitHub type, drop empty sections, then tidy headings
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            let body = issue.body || "";

            // ---------- 1) Extract selected Type from the "### Type" section ----------
            const typeBlockMatch = body.match(/(^|\n)#{2,}\s*Type\s*\n+([\s\S]*?)(?=\n#{2,}\s|\n*$)/i);
            let selected = null;
            if (typeBlockMatch) {
              const typeBlock = typeBlockMatch[2];
              const typeValueMatch = typeBlock.match(/\b(Bug|Feature|Task)\b/i);
              if (typeValueMatch) selected = typeValueMatch[1].toLowerCase(); // "bug" | "feature" | "task"
            }

            // ---------- 2) Map to official GitHub issue type ----------
            let typeMapped = false;
            if (selected) {
              const map = { bug: "bug", feature: "feature", task: "task" };
              const ghType = map[selected];
              if (ghType) {
                try {
                  await github.request("PATCH /repos/{owner}/{repo}/issues/{issue_number}", {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    type: ghType,
                  });
                  typeMapped = true;
                  core.info(`Set GitHub issue type to: ${ghType}`);
                } catch (e) {
                  core.warning(`Failed to set GitHub issue type: ${e.message}`);
                }
              }
            } else {
              core.info("No Type detected; skipping type mapping.");
            }

            let newBody = body;

            // ---------- Helpers ----------
            // Find a section by heading pattern; return {start, end, heading, content}
            function findSection(headingPattern) {
              const re = new RegExp(
                String.raw`(^|\n)(#{2,}\s*${headingPattern}[^\n]*\n)` + // heading line
                String.raw`([\s\S]*?)(?=\n#{2,}\s|\n*$)`,                 // content until next heading/EOF
                "i"
              );
              const m = newBody.match(re);
              if (!m) return null;
              const full = m[0];
              const start = m.index;
              const heading = m[2];
              const content = m[3];
              const end = start + full.length;
              return { re, start, end, heading, content };
            }

            // Remove entire section if content is exactly "_No response_"
            function removeIfNoResponse(headingPattern) {
              const sec = findSection(headingPattern);
              if (!sec) return false;
              if (/^\s*_No response_\s*$/i.test(sec.content.trim())) {
                newBody = newBody.slice(0, sec.start) + "\n" + newBody.slice(sec.end);
                core.info(`Removed empty section: ${headingPattern}`);
                return true;
              }
              return false;
            }

            // Rename a section heading to a clean simple H3 (keeps content)
            function renameHeadingSimple(fromPattern, toHeading) {
              const sec = findSection(fromPattern);
              if (!sec) return false;
              const before = newBody.slice(0, sec.start);
              const after = newBody.slice(sec.end);
              const newSection =
                (newBody[sec.start - 1] === "\n" ? "\n" : "") +
                `### ${toHeading}\n` +
                sec.content;
              newBody = before + newSection + after;
              core.info(`Renamed heading to: ${toHeading}`);
              return true;
            }

            // Convenience: try multiple patterns for the same logical section
            function removeIfNoResponseAny(patterns) {
              for (const p of patterns) {
                if (removeIfNoResponse(p)) return true;
              }
              return false;
            }
            function renameHeadingSimpleAny(patterns, toHeading) {
              for (const p of patterns) {
                if (renameHeadingSimple(p, toHeading)) return true;
              }
              return false;
            }

            // ---------- 3) FIRST: remove empty sections ----------
            // Accept both "-" and "—" and also support already-simplified headings
            const bugLong = String.raw`Bug\s+[-—]\s*Steps to Reproduce\s*&\s*Expected Result\s*\(only\s*if\s*Type\s*=\s*Bug\)`;
            const featureLong = String.raw`Feature\s+[-—]\s*Solution\s*&\s*Expected Benefits\s*\(only\s*if\s*Type\s*=\s*Feature\)`;
            const bugShort = String.raw`Bug\b`;
            const featureShort = String.raw`Feature\b`;

            const bugRemoved = removeIfNoResponseAny([bugLong, bugShort]);
            const featureRemoved = removeIfNoResponseAny([featureLong, featureShort]);

            // ---------- 4) THEN: tidy headings ----------
            // a) Strip "(optional)" from "Additional Context (optional)"
            renameHeadingSimple(String.raw`Additional Context\s*\(optional\)`, "Additional Context");

            // b) Replace verbose per-type headings with a clean simple one
            if (selected === "bug" && !bugRemoved) {
              // Long -> "Bug", or already simple -> no-op
              renameHeadingSimpleAny([bugLong], "Bug");
            }
            if (selected === "feature" && !featureRemoved) {
              // Long -> "Feature", or already simple -> no-op
              renameHeadingSimpleAny([featureLong], "Feature");
            }

            // ---------- 5) FINALLY: remove the "Type" section if mapping succeeded ----------
            if (typeMapped && selected) {
              const typeSec = findSection(String.raw`Type`);
              if (typeSec) {
                newBody = newBody.slice(0, typeSec.start) + "\n" + newBody.slice(typeSec.end);
                core.info("Removed 'Type' section after successful mapping.");
              }
            } else {
              core.info("Keeping 'Type' section (type not mapped or not detected).");
            }

            // Normalize: collapse >2 blank lines into 1 for cleanliness
            newBody = newBody.replace(/\n{3,}/g, "\n\n");

            // ---------- 6) Patch body if changed ----------
            if (newBody !== body) {
              await github.request("PATCH /repos/{owner}/{repo}/issues/{issue_number}", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: newBody.trim() + "\n",
              });
              core.info("Issue body updated.");
            } else {
              core.info("No body changes needed.");
            }
