#
# Maximum size of the file to upload in MB
#

exo.uploadLimit=${exo.uploadLimit:200}


###########################
#
# Datasources
#

# JNDI Name for JCR datasource
# portal name will be appended to this name before the JNDI lookup
# example : java:/comp/env/exo-jcr in "portal" portal will result in a JNDI lookup on context : java:/comp/env/exo-jcr_portal
gatein.jcr.datasource.name=${exo.jcr.datasource.name:java:/comp/env/exo-jcr}

# JNDI Name for IDM datasource
# portal name will be appended to this name before the JNDI lookup
# example : java:/comp/env/exo-idm in "portal" portal will result in a JNDI lookup on context : java:/comp/env/exo-idm_portal
gatein.idm.datasource.name=${exo.idm.datasource.name:java:/comp/env/exo-idm}

# JNDI Name for JPA datasource
exo.jpa.datasource.name=${exo.jpa.datasource.name:java:/comp/env/exo-jpa_portal}

###########################
#
# Quartz Configuration
#

#Configure Main Scheduler Properties
exo.quartz.scheduler.instanceName=${exo.quartz.scheduler.instanceName:ExoScheduler}
exo.quartz.scheduler.instanceId=${exo.quartz.scheduler.instanceId:AUTO}

#Configure ThreadPool
exo.quartz.threadPool.class=${exo.quartz.threadPool.class:org.quartz.simpl.SimpleThreadPool}
exo.quartz.threadPool.threadPriority=${exo.quartz.threadPool.threadPriority:5}
exo.quartz.threadPool.threadCount=${exo.quartz.threadPool.threadCount:25}

#Configure JobStore
exo.quartz.jobStore.misfireThreshold=${exo.quartz.jobStore.misfireThreshold:6000}
exo.quartz.jobStore.class=${exo.quartz.jobStore.class:org.quartz.impl.jdbcjobstore.JobStoreTX}
exo.quartz.jobStore.driverDelegateClass=${exo.quartz.jobStore.driverDelegateClass:org.quartz.impl.jdbcjobstore.StdJDBCDelegate}
exo.quartz.jobStore.useProperties=${exo.quartz.jobStore.useProperties:false}
exo.quartz.jobStore.dataSource=${exo.quartz.jobStore.dataSource:quartzDS}
exo.quartz.jobStore.tablePrefix=${exo.quartz.jobStore.tablePrefix:QRTZ_}
exo.quartz.jobStore.clusterCheckinInterval=${exo.quartz.jobStore.clusterCheckinInterval:20000}
exo.quartz.jobStore.maxMisfiresToHandleAtATime=${exo.quartz.jobStore.maxMisfiresToHandleAtATime:20}
exo.quartz.jobStore.dontSetAutoCommitFalse=${exo.quartz.jobStore.dontSetAutoCommitFalse:false}
exo.quartz.jobStore.acquireTriggersWithinLock=${exo.quartz.jobStore.acquireTriggersWithinLock:false}
exo.quartz.jobStore.lockHandler.class=${exo.quartz.jobStore.lockHandler.class:}
exo.quartz.jobStore.driverDelegateInitString=${exo.quartz.jobStore.driverDelegateInitString:}
exo.quartz.jobStore.txIsolationLevelSerializable=${exo.quartz.jobStore.txIsolationLevelSerializable:false}
exo.quartz.jobStore.selectWithLockSQL=${exo.quartz.jobStore.selectWithLockSQL:SELECT * FROM \\{0\\}LOCKS WHERE SCHED_NAME = \\{1\\} AND LOCK_NAME = ? FOR UPDATE}
exo.quartz.dataSource.quartzDS.jndiURL=${exo.quartz.dataSource.quartzDS.jndiURL:java:/comp/env/exo-jpa_portal}

###########################
#
# Custom Password Policy
#

gatein.validators.passwordpolicy.regexp=${gatein.validators.passwordpolicy.regexp:((?=.*\\d)(?=.*[a-z])(?=.*[A-Z]).\\{9,256\\})}
gatein.validators.passwordpolicy.length.max=${gatein.validators.passwordpolicy.length.max:256}
gatein.validators.passwordpolicy.length.min=${gatein.validators.passwordpolicy.length.min:9}

###########################
#
# Misc
#

# Don't check for ehcache upgrades
net.sf.ehcache.skipUpdateCheck=true

# Don't check for quartz upgrades
org.terracotta.quartz.skipUpdateCheck=true


