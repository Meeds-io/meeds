# Checkpoints of the startup shown on the loading page, in the order they are displayed.
# Format: <id>=<regular expression found in a line of the platform log>
# The id gets its label from the key loading.checkpoint.<id> of the language bundles.
# Special values: @start is reached when the loading page starts, @deployed when all the web applications are deployed.
# A checkpoint whose text never shows up in the log is just not ticked until the platform is started.
# Copy this file in ${exo.conf.dir}/loading/ to change the list.
server=@start
applications=@deployed
kernel=Building root container
database=EntityManagerFactory \[meeds-jpa\]
search=Use ES Version
sites=Importing Site of type
upgrade=UpgradeProductService
templates=Importing Space Templates
