<!doctype html>
<html lang="{{lang}}" dir="{{dir}}" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>{{loading.title}} - {{product}}</title>
<link rel="stylesheet" href="/_loading/loading.css">
<link rel="stylesheet" href="/_loading/theme.css">
<link rel="stylesheet" href="/_loading/custom.css">
<noscript><meta http-equiv="refresh" content="10"></noscript>
</head>
<body>
<main>
  <div class="scene">
    <svg viewBox="0 0 800 420" role="img" aria-label="{{loading.scene}}" preserveAspectRatio="xMidYMid meet">
 <rect class="floor" x="0" y="370" width="800" height="50"/>

 <rect x="226" y="330" width="8" height="40" rx="2" class="post"/><rect x="566" y="330" width="8" height="40" rx="2" class="post"/>

 <rect x="190" y="40" width="420" height="290" rx="10" class="win"/>
 <rect x="190" y="40" width="420" height="32" rx="10" class="winbar"/><rect x="190" y="60" width="420" height="12" class="winbar"/>
 <rect x="190" y="72" width="46" height="258" class="side0"/>
 <!-- empty slots -->
 <g class="slot"><rect x="204" y="49" width="54" height="14" rx="3"/><rect x="252" y="88" width="222" height="100" rx="6"/><rect x="252" y="200" width="222" height="110" rx="6"/><rect x="488" y="88" width="108" height="84" rx="6"/><rect x="488" y="184" width="108" height="126" rx="6"/><rect x="200" y="90" width="26" height="110" rx="6"/></g>
 <!-- installed pieces -->
 <g class="logo"><rect x="200" y="44" width="64" height="24" fill="var(--winbar)"/><image class="logo-l" href="/_loading/logo.png" x="204" y="45" width="54" height="20" preserveAspectRatio="xMinYMid meet"/><image class="logo-d" href="/_loading/logo-dark.png" x="204" y="45" width="54" height="20" preserveAspectRatio="xMinYMid meet"/></g>
 <g class="side"><rect x="196" y="86" width="38" height="124" fill="var(--side0)"/><rect x="203" y="94" width="20" height="20" rx="6" fill="var(--primary)" opacity="1"/><rect x="203" y="122" width="20" height="20" rx="6" fill="var(--primary)" opacity="0.75"/><rect x="203" y="150" width="20" height="20" rx="6" fill="var(--primary)" opacity="0.55"/><rect x="203" y="178" width="20" height="20" rx="6" fill="var(--primary)" opacity="0.4"/></g>

 <g class="c2"><rect x="252" y="200" width="222" height="110" rx="6" class="pcard"/><circle cx="272" cy="220" r="9" fill="var(--primary)"/><rect x="288" y="213" width="70" height="6" rx="3" class="ln"/><rect x="288" y="224" width="40" height="5" rx="2.5" class="ln2"/><rect x="264" y="242" width="190" height="52" rx="4" fill="var(--primary)" opacity=".18"/><path d="M264 286l40-22 36 12 40-26 40 18 34-14v32z" fill="var(--primary)" opacity=".45"/></g>
 <g class="w1"><rect x="488" y="88" width="108" height="84" rx="6" class="pcard"/><rect x="498" y="98" width="52" height="6" rx="3" class="ln"/><circle cx="504" cy="122" r="8" fill="#e25d5d"/><circle cx="522" cy="122" r="8" fill="#3f8487"/><circle cx="540" cy="122" r="8" fill="#f2b84b"/><circle cx="558" cy="122" r="8" fill="#5a6fb8"/><circle cx="576" cy="122" r="8" fill="#8a5a3b"/><circle cx="504" cy="142" r="8" fill="#e25d5d"/><circle cx="522" cy="142" r="8" fill="#3f8487"/><circle cx="540" cy="142" r="8" fill="#f2b84b"/><circle cx="558" cy="142" r="8" fill="#5a6fb8"/><circle cx="576" cy="142" r="8" fill="#8a5a3b"/></g>
 <g class="w2"><rect x="488" y="184" width="108" height="126" rx="6" class="pcard"/><rect x="498" y="194" width="60" height="6" rx="3" class="ln"/><circle cx="504" cy="220" r="6" fill="var(--secondary)"/><rect x="516" y="217" width="60" height="6" rx="3" class="ln"/><circle cx="504" cy="246" r="6" fill="var(--secondary)"/><rect x="516" y="243" width="52" height="6" rx="3" class="ln"/><circle cx="504" cy="272" r="6" fill="var(--secondary)"/><rect x="516" y="269" width="44" height="6" rx="3" class="ln"/><circle cx="504" cy="298" r="6" fill="var(--secondary)"/><rect x="516" y="295" width="36" height="6" rx="3" class="ln"/></g>

 <!-- ladder (leans on the window) -->
 <g class="ladder"><line x1="118" y1="370" x2="168" y2="62" /><line x1="146" y1="370" x2="188" y2="62" /><line x1="126" y1="345" x2="153" y2="345"/><line x1="132" y1="302" x2="158" y2="302"/><line x1="139" y1="259" x2="164" y2="259"/><line x1="145" y1="216" x2="169" y2="216"/><line x1="151" y1="173" x2="174" y2="173"/><line x1="158" y1="130" x2="180" y2="130"/><line x1="164" y1="87" x2="185" y2="87"/></g>
 <!-- worker 1 on ladder, hanging the logo -->
 <g class="wk1" transform="translate(166 160) scale(1 1)">
  <ellipse cx="0" cy="1" rx="16" ry="3" fill="var(--shadow)"/>
  <g class="legL"><rect x="-8" y="-30" width="7" height="30" rx="3" fill="var(--pants)"/></g>
  <g class="legR"><rect x="1" y="-30" width="7" height="30" rx="3" fill="var(--pants)"/></g>
  <g class="armL"><line x1="0" y1="-54" x2="-6" y2="-28" stroke="#e25d5d" stroke-width="7" stroke-linecap="round"/><circle cx="-6" cy="-28" r="3.6" fill="#f1c7a0"/></g>
  <rect x="-11" y="-60" width="22" height="34" rx="8" fill="#e25d5d"/>
  <circle cx="0" cy="-70" r="9.5" fill="#f1c7a0"/>
  <path d="M-10 -72a10 10 0 0 1 20 0c-4-5-14-6-20 0z" fill="#3a2a22"/>
  <g class="armR"><line x1="0" y1="-54" x2="22" y2="-68" stroke="#e25d5d" stroke-width="7" stroke-linecap="round"/><circle cx="22" cy="-68" r="3.6" fill="#f1c7a0"/></g>
  
</g>

 <!-- server rack + cable -->
 <g class="rack"><rect x="30" y="268" width="62" height="102" rx="5"/><rect x="38" y="278" width="46" height="14" rx="3" class="unit"/><circle cx="46" cy="285" r="2.6" class="led l0"/><rect x="38" y="300" width="46" height="14" rx="3" class="unit"/><circle cx="46" cy="307" r="2.6" class="led l1"/><rect x="38" y="322" width="46" height="14" rx="3" class="unit"/><circle cx="46" cy="329" r="2.6" class="led l2"/><rect x="38" y="344" width="46" height="14" rx="3" class="unit"/><circle cx="46" cy="351" r="2.6" class="led l0"/></g>
 <path class="cable" d="M92 350 C 140 372, 200 372, 300 348 S 420 340, 470 332" fill="none"/>
 <g class="wk4" transform="translate(120 370) scale(1 1)">
  <ellipse cx="0" cy="1" rx="16" ry="3" fill="var(--shadow)"/>
  <g class="legL"><rect x="-8" y="-30" width="7" height="30" rx="3" fill="var(--pants)"/></g>
  <g class="legR"><rect x="1" y="-30" width="7" height="30" rx="3" fill="var(--pants)"/></g>
  <g class="armL"><line x1="0" y1="-54" x2="-18" y2="-40" stroke="#5a6fb8" stroke-width="7" stroke-linecap="round"/><circle cx="-18" cy="-40" r="3.6" fill="#8a5a3b"/></g>
  <rect x="-11" y="-60" width="22" height="34" rx="8" fill="#5a6fb8"/>
  <circle cx="0" cy="-70" r="9.5" fill="#8a5a3b"/>
  <path d="M-10 -72a10 10 0 0 1 20 0c-4-5-14-6-20 0z" fill="#1d1a1a"/>
  <g class="armR"><line x1="0" y1="-54" x2="6" y2="-28" stroke="#5a6fb8" stroke-width="7" stroke-linecap="round"/><circle cx="6" cy="-28" r="3.6" fill="#8a5a3b"/></g>
  
</g>

 <!-- carrier walking in with a card -->
 <g class="carrier"><g class="wk2" transform="translate(0 370) scale(1 1)">
  <ellipse cx="0" cy="1" rx="16" ry="3" fill="var(--shadow)"/>
  <g class="legL"><rect x="-8" y="-30" width="7" height="30" rx="3" fill="var(--pants)"/></g>
  <g class="legR"><rect x="1" y="-30" width="7" height="30" rx="3" fill="var(--pants)"/></g>
  <g class="armL"><line x1="0" y1="-54" x2="16" y2="-40" stroke="#3f8487" stroke-width="7" stroke-linecap="round"/><circle cx="16" cy="-40" r="3.6" fill="#c98f64"/></g>
  <rect x="-11" y="-60" width="22" height="34" rx="8" fill="#3f8487"/>
  <circle cx="0" cy="-70" r="9.5" fill="#c98f64"/>
  <path d="M-10 -72a10 10 0 0 1 20 0c-4-5-14-6-20 0z" fill="#2a1c14"/>
  <g class="armR"><line x1="0" y1="-54" x2="18" y2="-44" stroke="#3f8487" stroke-width="7" stroke-linecap="round"/><circle cx="18" cy="-44" r="3.6" fill="#c98f64"/></g>
  <rect x="8" y="-72" width="34" height="26" rx="4" class="box"/><rect x="13" y="-66" width="16" height="4" rx="2" fill="#fff" opacity=".8"/><rect x="13" y="-58" width="24" height="4" rx="2" fill="#fff" opacity=".5"/>
</g></g>

 <!-- desk + laptop worker -->
 <g class="wk3" transform="translate(700 370) scale(-1 1)">
  <ellipse cx="0" cy="1" rx="16" ry="3" fill="var(--shadow)"/>
  <g class="legL"><rect x="-8" y="-30" width="7" height="30" rx="3" fill="var(--pants)"/></g>
  <g class="legR"><rect x="1" y="-30" width="7" height="30" rx="3" fill="var(--pants)"/></g>
  <g class="armL"><line x1="0" y1="-54" x2="-16" y2="-34" stroke="#f2b84b" stroke-width="7" stroke-linecap="round"/><circle cx="-16" cy="-34" r="3.6" fill="#f4d0b5"/></g>
  <rect x="-11" y="-60" width="22" height="34" rx="8" fill="#f2b84b"/>
  <circle cx="0" cy="-70" r="9.5" fill="#f4d0b5"/>
  <path d="M-10 -72a10 10 0 0 1 20 0c-4-5-14-6-20 0z" fill="#6b3d1e"/>
  <g class="armR"><line x1="0" y1="-54" x2="-14" y2="-30" stroke="#f2b84b" stroke-width="7" stroke-linecap="round"/><circle cx="-14" cy="-30" r="3.6" fill="#f4d0b5"/></g>
  
</g>
 <g class="desk"><rect x="640" y="330" width="126" height="8" rx="3"/><rect x="650" y="338" width="6" height="32"/><rect x="750" y="338" width="6" height="32"/><rect x="654" y="306" width="40" height="24" rx="2" class="lap"/></g>
 <!-- plant -->
 <g class="plant"><rect x="760" y="352" width="22" height="18" rx="3" fill="var(--secondary)"/><path d="M771 352c-14-14-14-30-4-40 8 10 8 24 4 40zM771 352c10-12 22-18 28-16-4 12-16 18-28 16z" fill="var(--primary)"/></g>

</svg>
    <p class="bubble" dir="{{dir}}"><span class="b1">{{loading.phase.server}}</span><span class="b2">{{loading.phase.applications}}</span><span class="b3">{{loading.phase.services}}</span></p>
  </div>
  <section class="status" role="status">
    <h1>{{loading.heading}}</h1>
    <div class="progress" id="bar"></div>
    <ul class="steps" id="steps">{{checkpoints}}</ul>
    <p class="count" id="count" data-template="{{loading.progress}}" hidden></p>
    <p class="error" id="error" role="alert" hidden>{{loading.error}}</p>
    <p class="error" id="lost" role="alert" hidden>{{loading.unreachable}}</p>
    <p id="wait">{{loading.wait}}</p>
    <p class="elapsed" dir="ltr"><span>{{loading.elapsed}}</span> <time id="elapsed">0:00</time></p>
  </section>
</main>
<script src="/_loading/loading.js"></script>
</body>
</html>
